name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build debug APK
        env:
          HERMES_GATEWAY_KEY: ${{ secrets.HERMES_GATEWAY_KEY }}
          FREELLM_API_KEY: ${{ secrets.FREELLM_API_KEY }}
        run: gradle assembleDebug --stacktrace

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v82"
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" "Hermes_Agent_${TAG}.apk"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Hermes Agent $TAG (Complete Bionic Shared Libraries & Python Fix)" --notes "v82: Complete Native Bionic shared libraries packaged (libz.so, libsqlite3.so, libreadline.so, liblzma.so, libbz2.so, libexpat.so, libncursesw.so). All Python C extensions verified."
          gh release upload "$TAG" "Hermes_Agent_${TAG}.apk" --clobber
          echo "Release $TAG uploaded successfully!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Harness-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
